name: progga_mobile
description: Enterprise MCQ Exam Platform Mobile Client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Routing
  go_router: ^12.1.3

  # Network
  dio: ^5.4.0

  # Storage (Offline caching & secure credentials)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # Models & Parsing
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # System Utilities & Icons
  cupertino_icons: ^1.0.6
  uuid: ^4.3.3
  intl: ^0.19.0
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  google_fonts: ^6.1.0
  google_sign_in: ^6.2.1
  fl_chart: ^0.66.0 # For result performance graphs
  flutter_markdown: ^0.6.18 # For LaTeX / question rendering
  flutter_math_fork: ^0.7.2 # For LaTeX math parsing/formula rendering
  image_picker: ^1.0.7

  # SVG Rendering
  flutter_svg: ^2.0.9

  # Video Playing
  video_player: ^2.8.2

  # Image Caching
  cached_network_image: ^3.3.1

  # FCM (Firebase Notifications)
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  url_launcher: ^6.3.2

  # Security Utilities
  flutter_jailbreak_detection_plus: ^1.10.7
  safe_device: ^1.1.4
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

  # Code Generation
  build_runner: ^2.4.8
  freezed: ^2.4.7
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Li Ador Noirrit
      fonts:
        - asset: assets/fonts/liador/Li Ador Noirrit Regular.ttf
        - asset: assets/fonts/liador/Li Ador Noirrit Light.ttf
          weight: 300
        - asset: assets/fonts/liador/Li Ador Noirrit SemiBold.ttf
          weight: 600
        - asset: assets/fonts/liador/Li Ador Noirrit Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 21
